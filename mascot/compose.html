<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>New message</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #1f2a3a; background: #fff; }
    .bar { height: 38px; -webkit-app-region: drag; border-bottom: 1px solid #eceef2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #5f6b7a; }
    .row { display: flex; gap: 10px; padding: 10px 20px; border-bottom: 1px solid #f0f2f5; font-size: 13px; }
    .row span { color: #8a94a3; width: 56px; }
    textarea { width: 100%; height: calc(100% - 160px); box-sizing: border-box; padding: 16px 20px; border: 0; outline: none; resize: none; font: 14px/1.6 -apple-system, system-ui, sans-serif; color: #1f2a3a; }
    .foot { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 20px; border-top: 1px solid #eceef2; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8a94a3; background: #fff; }
    .send { background: #185FA5; color: #fff; border: 0; border-radius: 8px; padding: 7px 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="bar">New message</div>
  <div class="row"><span>To</span>payroll@brouwerij-de-kroon.example</div>
  <div class="row"><span>Subject</span>Meal vouchers from January</div>
  <textarea id="body" maxlength="4000" placeholder="Write your email…"></textarea>
  <div class="foot"><span>Demo mailbox · checked by Company brain on this device</span><button class="send" type="button">Send</button></div>
  <script src="compose.js"></script>
</body>
</html>
