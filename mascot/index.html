<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
  <title>Company brain</title>
  <link rel="stylesheet" href="mascot.css" />
</head>
<body>
  <div class="stage calm" id="stage">
    <div class="card hit" id="card" hidden>
      <div class="card-head">
        <span class="brand"><span class="dot"></span>Company brain</span>
        <button class="close" id="close" aria-label="Close">×</button>
      </div>

      <form id="ask-form" class="ask">
        <input id="question" type="text" maxlength="500" placeholder="Ask anything about payroll…" autocomplete="off" />
        <button type="submit" aria-label="Ask">↵</button>
      </form>

      <div id="answer" class="answer" hidden>
        <div class="label" id="a-label"></div>
        <div class="value" id="a-value"></div>
        <div class="meta"><span class="chip" id="a-chip"></span><span id="a-source"></span></div>
        <div class="expert" id="a-expert"></div>
      </div>

      <div id="warning" class="warn" hidden>
        <div class="warn-title">Heads up before you send</div>
        <p id="w-text"></p>
        <div class="meta"><span class="chip trusted" id="w-chip"></span><span id="w-source"></span></div>
        <div class="actions">
          <button id="fix" class="primary">Fix it</button>
          <button id="ignore">Ignore</button>
        </div>
      </div>

      <div id="note" class="note" hidden></div>
      <button class="link" id="open-compose">Open demo email</button>
    </div>

    <div class="mascot hit" id="mascot" title="Click to ask · drag to move">
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      <svg viewBox="0 0 160 160" aria-label="Company brain mascot">
        <defs>
          <radialGradient id="shine" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity=".55" />
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>
        <ellipse class="shadow" cx="80" cy="150" rx="44" ry="6" />
        <g class="bob">
          <path class="body" d="M80 40 C118 40 140 66 138 98 C136 128 112 144 80 144 C48 144 22 128 22 98 C20 66 42 40 80 40 Z" />
          <path d="M80 40 C118 40 140 66 138 98 C136 128 112 144 80 144 C48 144 22 128 22 98 C20 66 42 40 80 40 Z" fill="url(#shine)" />
          <g class="face">
            <ellipse class="eye" cx="62" cy="94" rx="7" ry="10" />
            <ellipse class="eye" cx="98" cy="94" rx="7" ry="10" />
            <circle cx="64.5" cy="90" r="2.4" fill="#fff" />
            <circle cx="100.5" cy="90" r="2.4" fill="#fff" />
            <ellipse cx="48" cy="110" rx="7" ry="4" fill="#ff8a8a" opacity=".35" />
            <ellipse cx="112" cy="110" rx="7" ry="4" fill="#ff8a8a" opacity=".35" />
            <path class="mouth" d="M70 114 Q80 121 90 114" fill="none" stroke="#1f2a3a" stroke-width="3" stroke-linecap="round" />
          </g>
          <g class="cap">
            <path d="M34 66 C38 30 122 30 126 66 Z" fill="#1d2b4a" />
            <path d="M34 66 C70 58 92 58 126 66 L132 72 C96 64 62 64 26 72 Z" fill="#14203a" />
            <path d="M104 64 C124 62 146 66 150 74 C136 74 118 72 104 70 Z" fill="#14203a" />
            <circle cx="80" cy="33" r="3.5" fill="#14203a" />
            <g transform="translate(55 42)">
              <rect x="0" y="0" width="3" height="12" rx="1.5" fill="#7ED957" transform="skewX(-20)" />
              <rect x="5" y="0" width="3" height="12" rx="1.5" fill="#4FB3F6" transform="skewX(-20)" />
              <text x="14" y="10.5" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing=".2">sdworx</text>
            </g>
          </g>
          <g class="badge">
            <circle cx="136" cy="44" r="14" fill="#E24B4A" stroke="#fff" stroke-width="2.5" />
            <text x="136" y="50" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" font-family="-apple-system, system-ui, sans-serif">!</text>
          </g>
        </g>
      </svg>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
