<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Company brain</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; user-select: none; }
    .stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 12px; box-sizing: border-box; -webkit-app-region: drag; }
    .bubble { max-width: 190px; margin-bottom: 8px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.95); color: #2c2c2a; font-size: 12px; line-height: 1.4; box-shadow: 0 2px 10px rgba(0,0,0,.15); opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
    .bubble.show { opacity: 1; transform: none; }
    svg { width: 150px; height: 140px; overflow: visible; }
    .body { transition: fill .4s; animation: wobble 4s ease-in-out infinite; transform-origin: 75px 80px; }
    .calm .body { fill: #5DCAA5; }
    .thinking .body { fill: #85B7EB; animation-duration: 1.2s; }
    .warning .body { fill: #EF9F27; animation: shake .5s ease-in-out infinite; }
    .eye { fill: #2c2c2a; animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; }
    .badge { opacity: 0; transition: opacity .3s; }
    .warning .badge { opacity: 1; }
    .shadow { fill: rgba(0,0,0,.12); animation: squash 4s ease-in-out infinite; transform-origin: 75px 132px; }
    @keyframes wobble { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-6px) scale(1.03,.97); } }
    @keyframes squash { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.85); } }
    @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  </style>
</head>
<body>
  <div class="stage calm" id="stage">
    <div class="bubble" id="bubble"></div>
    <svg viewBox="0 0 150 140" aria-label="Company brain mascot">
      <ellipse class="shadow" cx="75" cy="132" rx="40" ry="6" />
      <path class="body" d="M75 22 C112 22 132 50 130 82 C128 112 106 126 75 126 C44 126 20 112 20 82 C18 50 38 22 75 22 Z" />
      <ellipse class="eye" cx="58" cy="74" rx="6" ry="9" />
      <ellipse class="eye" cx="92" cy="74" rx="6" ry="9" />
      <path d="M62 96 Q75 104 88 96" fill="none" stroke="#2c2c2a" stroke-width="3" stroke-linecap="round" />
      <g class="badge">
        <circle cx="122" cy="30" r="15" fill="#E24B4A" />
        <text x="122" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">!</text>
      </g>
    </svg>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
